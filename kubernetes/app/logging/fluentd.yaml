apiVersion: v1
kind: ConfigMap
metadata:
  name: log-collector-config
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Tag               mongo.logs.*
        Path              /var/log/pods/*_*_*/mongodb/*.log
        Parser            docker
        DB                /var/log/fluentbit-mongo.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [FILTER]
        Name                kubernetes
        Match               mongo.logs.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     mongo.logs.var.log.pods.
        Merge_Log           On
        Keep_Log            Off

    [OUTPUT]
        Name            loki
        Match           mongo.logs.*
        Host            loki.logging.svc.cluster.local
        Port            3100
        Labels          job=mongodb-cluster-logs
        Line_Format     json
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mongo-log-collector
  namespace: logging
spec:
  selector:
    matchLabels:
      name: mongo-log-collector
  template:
    metadata:
      labels:
        name: mongo-log-collector
    spec:
      serviceAccountName: log-collector
      tolerations:
      - operator: Exists
        effect: NoSchedule
      containers:
      - name: fluent-bit
        image: cr.fluentbit.io/fluent/fluent-bit:3.0
        resources:
          limits: { memory: 250Mi, cpu: 200m }
          requests: { memory: 50Mi, cpu: 50m }
        volumeMounts:
        - name: varlog
          mountPath: /var/log
        - name: config
          mountPath: /fluent-bit/etc/
      volumes:
      - name: varlog
        hostPath: { path: /var/log }
      - name: config
        configMap: { name: log-collector-config }