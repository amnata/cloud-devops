apiVersion: v1
kind: Pod
metadata:
  name: env-validator-pod
  labels:
    app: secure-app
spec:
  initContainers:
  - name: verify-env-vars
    image: busybox:1.36
    command: ['sh', '-c']
    args:
      - |
        echo "Checking required environment variables..."
        
        # Check if DATABASE_URL is set and not empty
        if [ -z "$DATABASE_URL" ]; then
          echo "ERROR: DATABASE_URL environment variable is missing!"
          exit 1
        fi
        
        # Check if API_KEY is set and not empty
        if [ -z "$API_KEY" ]; then
          echo "ERROR: API_KEY environment variable is missing!"
          exit 1
        fi
        
        echo "All required environment variables are present. Proceeding..."
    env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: db-secret
          key: url
    - name: API_KEY
      value: "production-api-token-xyz" 

  containers:
  - name: main-app
    image: nginx:1.25
    ports:
    - containerPort: 80
    env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: db-secret
          key: url
    - name: API_KEY
      value: "production-api-token-xyz"